[project]
name = "slide-tutor"
version = "0.1.0"
description = "Lecture- and slide-specific study assistant (runs on your Claude subscription via the Claude Agent SDK)"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.179",
    "fastapi>=0.162.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]

[tool.uv]
package = false
