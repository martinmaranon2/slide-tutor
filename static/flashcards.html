<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Tutor · Flashcards</title>
<link rel="stylesheet" href="/static/app.css?v=20261114d">
</head>
<body class="fc-page">
<header class="topbar">
  <a class="brand" href="/">Slide Tutor</a>
  <nav id="crumbs" class="title crumbs" aria-label="Breadcrumb">Loading…</nav>
  <span class="spacer"></span>
</header>

<main class="fc-wrap">
  <section class="fc-sheet" aria-labelledby="fc-heading">
    <h1 id="fc-heading" class="fc-heading">Flashcards</h1>
    <p id="fc-prov" class="fc-prov" hidden></p>

    <div id="fc-status" class="fc-status" role="status" hidden></div>

    <div id="fc-toolbar" class="fc-toolbar" hidden>
      <button id="fc-copy" class="btn btn-sm btn-primary" type="button">Copy all</button>
      <a id="fc-download" class="btn btn-sm" download>Download .txt</a>
      <span id="fc-copied" class="fc-copied" role="status"></span>
      <span class="grow"></span>
      <button id="fc-action" class="btn btn-sm" type="button" hidden></button>
    </div>

    <div id="fc-msg" class="fc-msg" role="status">Loading…</div>
    <div id="fc-text" class="fc-text" aria-label="Flashcards, one per line: question >> answer"></div>
  </section>
</main>

<script src="/static/common.js?v=20261114d"></script>
<script src="/static/flashcards.js?v=20261114d"></script>
</body>
</html>
